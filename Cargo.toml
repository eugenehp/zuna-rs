[package]
name = "zuna-rs"
version = "0.2.2"
edition = "2021"
rust-version = "1.87"   # 1.89 with the optional `burn` backend
description = "ZUNA EEG Foundation Model — inference in Rust (Burn and/or RLX)"
keywords      = ["exg", "foundational", "BCI", "GPU", "CPU"]
authors       = ["Eugene Hauptmann"]
license-file  = "LICENSE"
homepage      = "https://github.com/eugenehp/zuna-rs"
repository    = "https://github.com/eugenehp/zuna-rs"
documentation = "https://docs.rs/zuna-rs"

autoexamples = false
autotests    = false
autobins     = false

exclude = [
    'data/*',
    'figures/*'
]

[lib]
name = "zuna_rs"
path = "src/lib.rs"

[[bin]]
name = "infer"
path = "src/bin/infer.rs"
required-features = ["rlx"]

[[bin]]
name = "download_weights"
path = "src/bin/download_weights.rs"
required-features = ["hf-download"]

[[bin]]
name = "fif_info"
path = "src/bin/fif_info.rs"

[[bin]]
name = "gen_sample_csv"
path = "src/bin/gen_sample_csv.rs"

[[example]]
name = "backend_bench"
path = "examples/backend_bench.rs"
required-features = ["burn", "ndarray"]

[[example]]
name = "backend_compare"
path = "examples/backend_compare.rs"
required-features = ["rlx", "rlx-cpu"]

[[example]]
name = "encode_dir"
path = "examples/encode_dir.rs"
required-features = ["rlx", "rlx-cpu"]

# ── Tests ──────────────────────────────────────────────────────────────────
[[test]]
name = "rlx_graph_compile"
path = "tests/rlx_graph_compile.rs"
required-features = ["rlx"]

[[test]]
name = "zuna11_weights"
path = "tests/zuna11_weights.rs"
required-features = ["rlx", "rlx-cpu"]

[[test]]
name = "mlx_op_parity"
path = "tests/mlx_op_parity.rs"
required-features = ["rlx", "rlx-mlx"]

[[test]]
name = "parity_rlx_vs_python"
path = "tests/parity_rlx_vs_python.rs"
required-features = ["rlx"]

[[test]]
name = "parity_rlx_vs_burn"
path = "tests/parity_rlx_vs_burn.rs"
required-features = ["burn", "rlx", "ndarray", "rlx-cpu"]

[features]
# Default: RLX on CPU only — no Burn dependency.
# Burn reference path: `--features burn,ndarray` (plus optional `wgpu`, `mlx`, …).
default = ["rlx", "rlx-cpu"]

# ── Inference engines (enable one or both) ─────────────────────────────────
# `burn` — optional; pulls burn 0.20 + model at crate root (`ZunaEncoder<B>`, …).
burn = ["dep:burn"]
# `rlx` — optional; pulls rlx from crates.io (`zuna_rs::rlx::*`).
rlx  = ["dep:rlx"]

# ── Burn backends (each requires `burn`; CPU needs `ndarray` too) ──────────
ndarray         = ["burn", "dep:burn-ndarray", "burn/ndarray"]
blas-accelerate = ["burn", "ndarray", "burn-ndarray?/blas-accelerate"]
openblas-system = ["burn", "ndarray", "burn-ndarray?/blas-openblas-system"]
wgpu            = ["burn", "burn/wgpu"]
wgpu-f16        = ["burn", "burn/wgpu"]
burn-mlx        = ["burn", "dep:burn-mlx"]
mlx             = ["burn", "burn-mlx"]
mlx-f16         = ["burn", "burn-mlx"]

# ── RLX backends (forwarded to the rlx crate) ──────────────────────────────
rlx-cpu             = ["rlx", "rlx/cpu"]
rlx-blas-accelerate = ["rlx", "rlx/blas-accelerate"]
rlx-blas-mkl        = ["rlx", "rlx/blas-mkl"]
rlx-blas-openblas   = ["rlx", "rlx/blas-openblas"]
rlx-metal           = ["rlx", "rlx/metal"]
rlx-mlx             = ["rlx", "rlx/mlx"]
# TODO: enable RLX wgpu in CI/benchmarks once rlx-wgpu lowers FusedResidualRmsNorm.
rlx-gpu             = ["rlx", "rlx/gpu"]
rlx-cuda            = ["rlx", "rlx/cuda"]
rlx-rocm            = ["rlx", "rlx/rocm"]
rlx-tpu             = ["rlx", "rlx/tpu"]
rlx-apple-silicon   = ["rlx", "rlx/apple-silicon"]
rlx-nvidia          = ["rlx", "rlx/nvidia"]

# Shorthand aliases (RLX)
cpu             = ["rlx-cpu"]
metal           = ["rlx-metal"]
gpu             = ["rlx-gpu"]
cuda            = ["rlx-cuda"]
rocm            = ["rlx-rocm"]
tpu             = ["rlx-tpu"]
apple-silicon   = ["rlx-apple-silicon"]
nvidia          = ["rlx-nvidia"]

hf-download = ["dep:hf-hub"]

[dependencies]
burn = { version = "0.20.1", default-features = false, features = ["std", "simd"], optional = true }
burn-ndarray = { version = "0.20.1", default-features = false, features = ["std", "simd", "multi-threads"], optional = true }
burn-mlx = { version = "0.1", git = "https://github.com/eidola-ai/burn-mlx", optional = true }

rlx = { version = "0.2.13", default-features = false, optional = true }

exg = { version = "0.0.6", default-features = false }
ndarray = "0.17"
safetensors = "0.7"
half = { version = "2", features = ["bytemuck"] }
rayon = "1"
clap = { version = "4", features = ["derive", "env"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.102"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }

[dev-dependencies]
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend", "bitmap_encoder",
    "ttf",
    "line_series", "area_series", "full_palette",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
cubek-matmul = { git = "https://github.com/eugenehp/cubek.git", branch = "cubek-matmul", package = "cubek-matmul" }
# For local rlx development, add path overrides here — e.g.
#   rlx-opt = { path = "../rlx/crates/core/rlx-opt" }
# `[patch]` entries are ignored by downstream consumers, so they must
# not be committed pointing at paths that only exist on one machine.
